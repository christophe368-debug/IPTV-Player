org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
# Dieser Rechner hat nur 7 GB RAM - Gradle darf nicht mehrere parallele
# Build-Prozesse gleichzeitig starten, sonst laeuft der Speicher wieder voll.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
# AGP 9+ verlangt Built-in Kotlin; klassische Plugins mit eigenem KGP
# schalten sich in ihrem eigenen build.gradle bei AGP>=9 selbst ab.
android.builtInKotlin=true
