workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        # In der Codemagic-Weboberflaeche unter "Code signing identities"
        # einrichten (Apple Developer Account -> App Store Distribution
        # Certificate + Provisioning Profile fuer die Bundle-ID unten).
        distribution_type: app_store
        bundle_identifier: com.christophermartin.iptvplayer.iptvPlayer
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        # Anpassen, falls der Standard-Branch auf GitHub anders heisst.
        - pattern: master
          include: true
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - christophermartin368@googlemail.com
        notify:
          success: true
          failure: true
      # Fuer automatisches Hochladen zu TestFlight/App Store spaeter
      # aktivieren (App Store Connect API-Key wird in Codemagic hinterlegt):
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
